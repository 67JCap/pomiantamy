# Реестр источников. Новый источник = новая запись, код менять не нужно.
# Включён только проверенный Belsat sitemap; остальные источники можно включить отдельно.
defaults:
  enabled: false
  poll_minutes: 15

sources:
  - id: belsat_google_news
    enabled: true
    type: google_news_sitemap
    url: "https://belsat.eu/shared/feed/google_news.php"
    weight: 0.8
    limit: 30
    max_concurrency: 3
    min_article_chars: 220
    tags: [политические заявления, политические репрессии, ответы оппозиции]

  - id: nexta_live
    type: rss
    url: "https://nexta.live/rss.xml"
    weight: 0.9
    tags: [политические заявления, политические репрессии]

  - id: reform_belarus
    type: telegram
    handle: "@reformbel"
    weight: 0.8
    tags: [ответы оппозиции, политические заявления]

  - id: belsat_eu
    type: rss
    url: "https://belsat.eu/feed/"
    weight: 0.8
    tags: [политические заявления, ответы оппозиции]

  - id: onliner_incidents
    type: scraper
    url: "https://onliner.cafer/..."
    item_selector: "article"
    title_selector: "h2 a"
    link_selector: "h2 a@href"
    image_selector: "img@src"
    weight: 0.6
    tags: [аварии]

  - id: chats_dtp_by
    type: telegram
    handle: "@dtp_by_chats"
    weight: 0.5
    media_download: true
    tags: [аварии]
